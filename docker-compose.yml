services:
  trimly:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://trimlybook.com/api/v1}
    container_name: trimly-frontend
    ports:
      - "84:80"
    restart: unless-stopped
    networks:
      - default
      - trimly_backend

networks:
  trimly_backend:
    external: true
    name: trimly_backend_default
