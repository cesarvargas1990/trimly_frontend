server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /trimly {
    return 301 /trimly/;
  }

  # La API pública usa /api/v1 en el dominio, mientras Laravel expone sus
  # rutas internamente bajo /trimly/api/v1.
  location ^~ /api/v1/ {
    proxy_pass http://trimly_app:8000/trimly/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Los assets que el panel guarda pertenecen al backend Laravel. Deben
  # atravesar este frontend para conservar las URLs públicas de Trimly.
  location ^~ /trimly/logos/ {
    proxy_pass http://trimly_app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /trimly/heroes/ {
    proxy_pass http://trimly_app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /trimly/assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /trimly/ {
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
